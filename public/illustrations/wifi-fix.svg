<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" width="360" height="280">
  <!-- Campus Gigabit Wi-Fi Signal Arcs: Anchor at center bottom (x=180, y=240) -->
  <defs>
    <radialGradient id="signalPulse" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#F7F1E6" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0036FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0036FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Expansion Wave -->
  <path d="M40,240 A140,140 0 0,1 320,240 Z" fill="url(#signalPulse)"/>

  <!-- Gigabit Wi-Fi Broadcaster Antenna Node -->
  <circle cx="180" cy="240" r="16" fill="#F7F1E6" stroke="#14181F" stroke-width="6"/>
  <circle cx="180" cy="240" r="7" fill="#0036FF"/>

  <!-- Inner Signal Arc -->
  <path d="M135,210 A55,55 0 0,1 225,210" fill="none" stroke="#F7F1E6" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Middle Signal Arc -->
  <path d="M100,175 A100,100 0 0,1 260,175" fill="none" stroke="#F7F1E6" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Outer High-Power Signal Arc -->
  <path d="M60,135 A150,150 0 0,1 300,135" fill="none" stroke="#F7F1E6" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Crest Peak Signal Arc -->
  <path d="M25,95 A200,200 0 0,1 335,95" fill="none" stroke="#F7F1E6" stroke-width="10" stroke-dasharray="14 10" stroke-linecap="round" opacity="0.85"/>

  <!-- High-Speed Data Packets / Sparkles -->
  <circle cx="90" cy="90" r="6" fill="#F7F1E6"/>
  <circle cx="270" cy="90" r="6" fill="#F7F1E6"/>
  <circle cx="180" cy="50" r="7" fill="#F7F1E6"/>

  <!-- Status Capsule Badge -->
  <g transform="translate(115, 10)">
    <rect width="130" height="32" rx="0" fill="#9ABC05" stroke="#F7F1E6" stroke-width="3"/>
    <text x="65" y="21" fill="#F7F1E6" font-family="sans-serif" font-weight="900" font-size="13" text-anchor="middle" letter-spacing="0.1em">ONLINE · 1 GBPS</text>
  </g>
</svg>
