<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" width="2048" height="2048">
  <defs>
    <!-- Patterns & Gradients -->
    <pattern id="brickPattern" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0,20 L 40,20 M 20,0 L 20,20" fill="none" stroke="#0036FF" stroke-width="1.5" stroke-opacity="0.3"/>
    </pattern>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0036FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#14181F" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Sky / Background Ambient -->
  <rect x="0" y="0" width="2048" height="2048" fill="none"/>

  <!-- CAMPUS HORIZON & DISTANT ARCHITECTURE -->
  <g id="distant-horizon">
    <!-- Distant mountains/skyline silhouetted in deep red/ink -->
    <polygon points="0,950 280,820 620,910 940,840 1280,890 1620,810 2048,930 2048,1100 0,1100" fill="#14181F" opacity="0.35"/>
    <!-- Distant campus tree line -->
    <path d="M0,980 Q100,940 200,980 Q300,930 400,980 Q500,940 600,980 Q700,930 800,980 Q900,940 1000,980 Q1100,930 1200,980 Q1300,940 1400,980 Q1500,930 1600,980 Q1700,940 1800,980 Q1900,930 2048,980 L2048,1120 L0,1120 Z" fill="#14181F" opacity="0.5"/>
  </g>

  <!-- MAIN CAMPUS GROUND QUADRANGLE -->
  <g id="campus-grounds">
    <!-- Great Lawn quad polygon -->
    <polygon points="120,1350 1024,960 1928,1350 1780,2048 268,2048" fill="#14181F"/>
    
    <!-- Central Paved Mall / Grand Walkway -->
    <polygon points="860,980 1188,980 1420,2048 628,2048" fill="#F7F1E6"/>
    <!-- Center pathway lines -->
    <line x1="1024" y1="980" x2="1024" y2="2048" stroke="#0036FF" stroke-width="4" stroke-dasharray="24 16"/>
    
    <!-- Left diagonal arterial walkway -->
    <polygon points="400,1400 680,1400 360,2048 100,2048" fill="#F7F1E6" opacity="0.9"/>
    
    <!-- Right diagonal arterial walkway -->
    <polygon points="1368,1400 1648,1400 1948,2048 1688,2048" fill="#F7F1E6" opacity="0.9"/>
    
    <!-- Geometric decorative lawn tiles -->
    <polygon points="280,1480 620,1480 500,1880 180,1880" fill="#0036FF" opacity="0.15"/>
    <polygon points="1428,1480 1768,1480 1868,1880 1548,1880" fill="#0036FF" opacity="0.15"/>
  </g>

  <!-- CENTRAL GRAND LIBRARY BUILDING (At Center: x=1024, y=600 to 980) -->
  <g id="central-library">
    <!-- Building Plinth / Base Steps -->
    <polygon points="680,980 1368,980 1420,1030 628,1030" fill="#F7F1E6"/>
    <line x1="650" y1="1000" x2="1398" y2="1000" stroke="#14181F" stroke-width="3"/>
    <line x1="638" y1="1015" x2="1410" y2="1015" stroke="#14181F" stroke-width="3"/>

    <!-- Main Library Facade Core -->
    <rect x="720" y="660" width="608" height="320" fill="#F7F1E6" stroke="#14181F" stroke-width="8"/>
    
    <!-- Neoclassical Columns -->
    <g fill="#14181F">
      <rect x="760" y="720" width="32" height="260"/>
      <rect x="830" y="720" width="32" height="260"/>
      <rect x="900" y="720" width="32" height="260"/>
      <rect x="970" y="720" width="32" height="260"/>
      <rect x="1044" y="720" width="32" height="260"/>
      <rect x="1114" y="720" width="32" height="260"/>
      <rect x="1184" y="720" width="32" height="260"/>
      <rect x="1254" y="720" width="32" height="260"/>
    </g>

    <!-- Grand Entrance Portal & Windows -->
    <rect x="964" y="820" width="120" height="160" fill="#0036FF"/>
    <path d="M964,820 Q1024,760 1084,820 Z" fill="#0036FF"/>
    <rect x="1004" y="870" width="40" height="110" fill="#14181F"/>

    <!-- Classical Pediment (Triangular Gable) -->
    <polygon points="680,660 1368,660 1024,460" fill="#F7F1E6" stroke="#14181F" stroke-width="8"/>
    <!-- Pediment Inset Relief -->
    <polygon points="730,640 1318,640 1024,490" fill="#0036FF"/>
    <!-- Library Clocks/Seal Center -->
    <circle cx="1024" cy="580" r="38" fill="#F7F1E6" stroke="#14181F" stroke-width="5"/>
    <line x1="1024" y1="580" x2="1024" y2="556" stroke="#14181F" stroke-width="4"/>
    <line x1="1024" y1="580" x2="1042" y2="580" stroke="#14181F" stroke-width="4"/>

    <!-- Clock Tower / Cupola atop Library -->
    <rect x="974" y="340" width="100" height="120" fill="#F7F1E6" stroke="#14181F" stroke-width="6"/>
    <polygon points="954,340 1094,340 1024,240" fill="#14181F"/>
    <line x1="1024" y1="240" x2="1024" y2="180" stroke="#F7F1E6" stroke-width="6"/>
    <!-- Civic Flag -->
    <polygon points="1024,180 1100,200 1024,220" fill="#0036FF"/>
  </g>

  <!-- WEST ACADEMIC BLOCK (Left: x=180 to 640) -->
  <g id="west-academic-block">
    <rect x="220" y="740" width="440" height="340" fill="#F7F1E6" stroke="#14181F" stroke-width="8"/>
    <polygon points="200,740 680,740 620,680 260,680" fill="#14181F"/>
    <!-- Modern Grid Windows -->
    <g fill="#14181F">
      <rect x="260" y="780" width="60" height="40"/>
      <rect x="360" y="780" width="60" height="40"/>
      <rect x="460" y="780" width="60" height="40"/>
      <rect x="560" y="780" width="60" height="40"/>

      <rect x="260" y="860" width="60" height="40"/>
      <rect x="360" y="860" width="60" height="40"/>
      <rect x="460" y="860" width="60" height="40"/>
      <rect x="560" y="860" width="60" height="40"/>

      <rect x="260" y="940" width="60" height="40"/>
      <rect x="360" y="940" width="60" height="40"/>
      <rect x="460" y="940" width="60" height="40"/>
      <rect x="560" y="940" width="60" height="40"/>
    </g>
    <!-- Accent canopy -->
    <rect x="340" y="1030" width="180" height="50" fill="#0036FF"/>
  </g>

  <!-- EAST SCIENCE COMPLEX (Right: x=1408 to 1868) -->
  <g id="east-science-complex">
    <rect x="1388" y="720" width="460" height="360" fill="#F7F1E6" stroke="#14181F" stroke-width="8"/>
    <polygon points="1368,720 1868,720 1828,660 1408,660" fill="#14181F"/>
    <!-- High tech lab glass strip -->
    <rect x="1428" y="760" width="380" height="60" fill="#0036FF" opacity="0.85"/>
    <g fill="#14181F">
      <rect x="1428" y="860" width="70" height="50"/>
      <rect x="1530" y="860" width="70" height="50"/>
      <rect x="1632" y="860" width="70" height="50"/>
      <rect x="1734" y="860" width="70" height="50"/>

      <rect x="1428" y="950" width="70" height="50"/>
      <rect x="1530" y="950" width="70" height="50"/>
      <rect x="1632" y="950" width="70" height="50"/>
      <rect x="1734" y="950" width="70" height="50"/>
    </g>
  </g>

  <!-- FLAT VECTOR CAMPUS TREES & FOLIAGE -->
  <g id="campus-trees">
    <!-- Left grove -->
    <circle cx="180" cy="1200" r="80" fill="#14181F"/>
    <circle cx="260" cy="1160" r="95" fill="#0036FF"/>
    <circle cx="210" cy="1130" r="70" fill="#F7F1E6"/>
    <rect x="230" y="1250" width="22" height="90" fill="#14181F"/>

    <!-- Library flank trees -->
    <circle cx="680" cy="1100" r="75" fill="#14181F"/>
    <circle cx="660" cy="1070" r="60" fill="#0036FF"/>
    <rect x="670" y="1140" width="16" height="70" fill="#14181F"/>

    <circle cx="1360" cy="1100" r="75" fill="#14181F"/>
    <circle cx="1380" cy="1070" r="60" fill="#0036FF"/>
    <rect x="1368" y="1140" width="16" height="70" fill="#14181F"/>

    <!-- Right grove -->
    <circle cx="1860" cy="1200" r="85" fill="#14181F"/>
    <circle cx="1800" cy="1160" r="90" fill="#0036FF"/>
    <rect x="1820" y="1250" width="22" height="90" fill="#14181F"/>
  </g>

  <!-- BEFORE-STATE DEFECTS (To be repaired by the 5 fix pieces) -->
  
  <!-- 1. Broken Tap Area (Anchor 600, 1500) -->
  <g id="before-tap" transform="translate(600, 1500)">
    <!-- Cracked pavement puddle -->
    <ellipse cx="0" cy="40" rx="90" ry="32" fill="#14181F" opacity="0.7"/>
    <ellipse cx="-10" cy="42" rx="65" ry="20" fill="#0036FF" opacity="0.4"/>
    <!-- Broken bent pipe stub leaking drips -->
    <path d="M-25,20 L-25,-30 L-5,-30 L-5,-5 L15,-5" fill="none" stroke="#14181F" stroke-width="12" stroke-linecap="round"/>
    <!-- Leaking water droplets -->
    <circle cx="15" cy="8" r="5" fill="#0036FF"/>
    <circle cx="15" cy="24" r="4" fill="#0036FF"/>
    <!-- Warning exclamation tag -->
    <circle cx="35" cy="-35" r="16" fill="#0036FF"/>
    <text x="35" y="-29" fill="#F7F1E6" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle">!</text>
  </g>

  <!-- 2. Dark Lamp Area (Anchor 1500, 1300) -->
  <g id="before-lamp" transform="translate(1500, 1300)">
    <!-- Base plate -->
    <ellipse cx="0" cy="60" rx="28" ry="10" fill="#14181F" opacity="0.6"/>
    <!-- Crooked unlit pole -->
    <path d="M-6,60 L-10,-40 L2,-70 L-20,-75" fill="none" stroke="#14181F" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-20" cy="-75" r="14" fill="#14181F" stroke="#0036FF" stroke-width="3"/>
    <!-- Dark shadow zone on walkway -->
    <ellipse cx="-30" cy="70" rx="60" ry="22" fill="#14181F" opacity="0.4"/>
  </g>

  <!-- 3. Disconnected Wi-Fi Area (Anchor 1024, 600) -->
  <g id="before-wifi" transform="translate(1024, 600)">
    <!-- No signal slash indicator -->
    <circle cx="0" cy="0" r="32" fill="#14181F" stroke="#0036FF" stroke-width="4"/>
    <path d="M-18,-18 L18,18" stroke="#0036FF" stroke-width="6" stroke-linecap="round"/>
    <path d="M-12,8 Q0,0 12,8" fill="none" stroke="#F7F1E6" stroke-width="3" opacity="0.4"/>
  </g>

  <!-- 4. Dark Corner / Missing Safety Point (Anchor 1700, 1650) -->
  <g id="before-safety" transform="translate(1700, 1650)">
    <!-- Unmonitored walkway hazard zone -->
    <rect x="-40" y="-10" width="80" height="20" fill="#14181F" opacity="0.6"/>
    <!-- Hazard diagonal stripes -->
    <line x1="-30" y1="10" x2="-10" y2="-10" stroke="#0036FF" stroke-width="4"/>
    <line x1="-5" y1="10" x2="15" y2="-10" stroke="#0036FF" stroke-width="4"/>
    <line x1="20" y1="10" x2="40" y2="-10" stroke="#0036FF" stroke-width="4"/>
  </g>

  <!-- 5. Messy Curb / Missing Bins Area (Anchor 400, 1700) -->
  <g id="before-bins" transform="translate(400, 1700)">
    <!-- Scattered litter on pavement -->
    <ellipse cx="0" cy="20" rx="70" ry="18" fill="#14181F" opacity="0.3"/>
    <rect x="-35" y="10" width="18" height="12" fill="#0036FF" transform="rotate(25 -35 10)"/>
    <circle cx="10" cy="18" r="8" fill="#14181F"/>
    <polygon points="30,22 45,15 42,28" fill="#0036FF"/>
  </g>
</svg>
