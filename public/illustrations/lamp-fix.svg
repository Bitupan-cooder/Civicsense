<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 460" width="380" height="460">
  <!-- Campus Pathway Lamp: Anchor center at base (x=190, y=420) -->
  <defs>
    <!-- Radiant light cone gradient -->
    <linearGradient id="lightCone" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#F7F1E6" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#F7F1E6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F7F1E6" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7F1E6" stop-opacity="1"/>
      <stop offset="50%" stop-color="#F7F1E6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0036FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Radiant Light Beam casting illumination onto pavement -->
  <polygon points="190,70 40,430 340,430" fill="url(#lightCone)"/>
  <!-- Illuminated pool of light on ground -->
  <ellipse cx="190" cy="430" rx="150" ry="24" fill="#F7F1E6" opacity="0.45"/>

  <!-- Lamp Base / Mount on ground -->
  <ellipse cx="190" cy="420" rx="36" ry="12" fill="#14181F"/>
  <rect x="178" y="390" width="24" height="30" fill="#14181F"/>
  
  <!-- Upright Sleek Campus Pole -->
  <line x1="190" y1="400" x2="190" y2="80" stroke="#14181F" stroke-width="14" stroke-linecap="round"/>
  <!-- Accent collar -->
  <rect x="180" y="240" width="20" height="12" fill="#0036FF"/>

  <!-- Architectural Lantern Top Housing -->
  <path d="M140,80 L240,80 L215,40 L165,40 Z" fill="#14181F"/>
  <!-- Spire finial -->
  <line x1="190" y1="40" x2="190" y2="20" stroke="#14181F" stroke-width="6"/>
  <circle cx="190" cy="18" r="5" fill="#0036FF"/>

  <!-- Glowing Lantern Luminary Core -->
  <polygon points="155,80 225,80 205,125 175,125" fill="#F7F1E6" stroke="#14181F" stroke-width="4"/>
  <circle cx="190" cy="100" r="32" fill="url(#lampGlow)"/>

  <!-- Light Aura Rings -->
  <circle cx="190" cy="100" r="48" fill="none" stroke="#F7F1E6" stroke-width="2" stroke-dasharray="6 6" opacity="0.7"/>

  <!-- Green / Cream "REPAIRED" badge -->
  <g transform="translate(240, 60)">
    <circle cx="24" cy="24" r="22" fill="#9ABC05" stroke="#F7F1E6" stroke-width="3"/>
    <path d="M15,24 L21,30 L33,18" fill="none" stroke="#F7F1E6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
