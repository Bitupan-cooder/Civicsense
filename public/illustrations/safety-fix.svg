<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 380" width="280" height="380">
  <!-- Campus Emergency Safety Station: Anchor at base (x=140, y=350) -->
  <defs>
    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0036FF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#F7F1E6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0036FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground Concrete Base Pad -->
  <polygon points="60,350 220,350 200,370 80,370" fill="#14181F"/>
  <rect x="100" y="330" width="80" height="25" fill="#F7F1E6" stroke="#14181F" stroke-width="5"/>

  <!-- Tower Pylon Column -->
  <rect x="115" y="80" width="50" height="255" fill="#14181F" stroke="#F7F1E6" stroke-width="4"/>
  
  <!-- High Visibility Reflector Bands -->
  <rect x="115" y="110" width="50" height="20" fill="#F7F1E6"/>
  <rect x="115" y="270" width="50" height="20" fill="#F7F1E6"/>

  <!-- Emergency Help Box Housing -->
  <rect x="100" y="150" width="80" height="100" fill="#0036FF" stroke="#F7F1E6" stroke-width="5"/>
  
  <!-- Intercom Speaker Grille -->
  <g fill="#F7F1E6">
    <circle cx="125" cy="175" r="3"/>
    <circle cx="140" cy="175" r="3"/>
    <circle cx="155" cy="175" r="3"/>
    <circle cx="125" cy="188" r="3"/>
    <circle cx="140" cy="188" r="3"/>
    <circle cx="155" cy="188" r="3"/>
  </g>

  <!-- Large One-Touch Push Button -->
  <circle cx="140" cy="220" r="16" fill="#F7F1E6" stroke="#14181F" stroke-width="4"/>
  <circle cx="140" cy="220" r="10" fill="#14181F"/>
  
  <!-- "HELP" Wordmark on Column -->
  <text x="140" y="206" fill="#F7F1E6" font-family="sans-serif" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="0.1em">EMERGENCY</text>

  <!-- Active Luminous 360 Blue/Red Beacon Top -->
  <rect x="125" y="55" width="30" height="25" fill="#14181F"/>
  <circle cx="140" cy="45" r="24" fill="url(#beaconGlow)"/>
  <circle cx="140" cy="45" r="14" fill="#F7F1E6" stroke="#0036FF" stroke-width="4"/>

  <!-- Beacon Light Rays -->
  <line x1="140" y1="15" x2="140" y2="5" stroke="#F7F1E6" stroke-width="4" stroke-linecap="round"/>
  <line x1="110" y1="25" x2="100" y2="15" stroke="#F7F1E6" stroke-width="4" stroke-linecap="round"/>
  <line x1="170" y1="25" x2="180" y2="15" stroke="#F7F1E6" stroke-width="4" stroke-linecap="round"/>

  <!-- Operational Badge -->
  <g transform="translate(180, 100)">
    <circle cx="20" cy="20" r="20" fill="#9ABC05" stroke="#F7F1E6" stroke-width="3"/>
    <path d="M12,20 L18,26 L28,14" fill="none" stroke="#F7F1E6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
