<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- Water Tap & Fountain Fix Piece: Anchor center at bottom (x=160, y=280) -->
  <defs>
    <filter id="cleanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#14181F" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Clean Stone Pedestal covering old puddle -->
  <ellipse cx="160" cy="280" rx="100" ry="28" fill="#F7F1E6" stroke="#14181F" stroke-width="6"/>
  <ellipse cx="160" cy="275" rx="80" ry="18" fill="#14181F"/>

  <!-- Fountain Basin / Column -->
  <rect x="140" y="160" width="40" height="115" fill="#F7F1E6" stroke="#14181F" stroke-width="6"/>
  <!-- Decorative Band -->
  <rect x="135" y="180" width="50" height="16" fill="#0036FF"/>
  
  <!-- Stainless Drinking Basin -->
  <path d="M110,160 Q160,195 210,160 L200,140 L120,140 Z" fill="#F7F1E6" stroke="#14181F" stroke-width="6"/>
  
  <!-- Swan-Neck Chrome Tap Dispenser -->
  <path d="M160,140 L160,80 Q160,50 190,50 L205,50 L205,70" fill="none" stroke="#14181F" stroke-width="12" stroke-linecap="round"/>
  <!-- Precision Valve Handle -->
  <rect x="145" y="70" width="30" height="8" fill="#0036FF"/>
  <circle cx="160" cy="74" r="5" fill="#F7F1E6"/>

  <!-- Fresh Pure Water Stream Jetting gracefully into basin -->
  <path d="M205,70 Q215,100 175,155" fill="none" stroke="#F7F1E6" stroke-width="6" stroke-linecap="round"/>
  <!-- Water sparkles -->
  <circle cx="218" cy="100" r="4" fill="#F7F1E6"/>
  <circle cx="195" cy="130" r="3" fill="#F7F1E6"/>

  <!-- Green / Cream "REPAIRED" badge -->
  <g transform="translate(190, 40)">
    <circle cx="24" cy="24" r="24" fill="#9ABC05" stroke="#F7F1E6" stroke-width="3"/>
    <!-- Checkmark -->
    <path d="M14,24 L22,32 L34,16" fill="none" stroke="#F7F1E6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
