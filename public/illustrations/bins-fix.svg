<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="320" height="280">
  <!-- Campus Dual-Stream Recycling & Waste Station: Anchor at bottom center (x=160, y=250) -->
  <defs>
    <filter id="binShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#14181F" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Pavement Curb Pad covering old trash debris -->
  <polygon points="20,250 300,250 280,270 40,270" fill="#14181F"/>
  <rect x="40" y="235" width="240" height="15" fill="#F7F1E6" stroke="#14181F" stroke-width="4"/>

  <!-- LEFT BIN: RECYCLABLES (Signal Red & Ink) -->
  <g transform="translate(60, 90)">
    <!-- Bin Body -->
    <rect x="0" y="25" width="90" height="120" rx="0" fill="#0036FF" stroke="#14181F" stroke-width="6"/>
    <!-- Lid with recycling slot -->
    <path d="M-6,25 L96,25 L86,0 L4,0 Z" fill="#14181F"/>
    <rect x="20" y="8" width="50" height="10" rx="4" fill="#F7F1E6"/>

    <!-- Universal Recycling Chasing Arrows Symbol -->
    <g transform="translate(25, 55)" stroke="#F7F1E6" stroke-width="3" fill="none">
      <path d="M20,5 L32,18 L24,18"/>
      <path d="M30,32 L15,36 L18,28"/>
      <path d="M8,18 L12,6 L5,10"/>
    </g>
    <!-- Label -->
    <text x="45" y="115" fill="#F7F1E6" font-family="sans-serif" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="0.1em">RECYCLE</text>
  </g>

  <!-- RIGHT BIN: ORGANIC / LANDFILL (Cream & Ink) -->
  <g transform="translate(170, 90)">
    <!-- Bin Body -->
    <rect x="0" y="25" width="90" height="120" rx="0" fill="#F7F1E6" stroke="#14181F" stroke-width="6"/>
    <!-- Lid -->
    <path d="M-6,25 L96,25 L86,0 L4,0 Z" fill="#14181F"/>
    <rect x="18" y="8" width="54" height="10" rx="2" fill="#0036FF"/>

    <!-- Waste / Sorting Icon -->
    <circle cx="45" cy="65" r="16" fill="#14181F"/>
    <path d="M38,60 L52,60 M40,65 L50,65 M42,70 L48,70" stroke="#F7F1E6" stroke-width="3" stroke-linecap="round"/>
    <!-- Label -->
    <text x="45" y="115" fill="#14181F" font-family="sans-serif" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="0.1em">ORGANIC</text>
  </g>

  <!-- Green / Cream "REPAIRED" badge -->
  <g transform="translate(230, 45)">
    <circle cx="22" cy="22" r="22" fill="#9ABC05" stroke="#F7F1E6" stroke-width="3"/>
    <path d="M13,22 L19,28 L31,16" fill="none" stroke="#F7F1E6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
