<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Friendly Student Reporter Character (Open Doodles CC0 style adapted to red/cream/ink) -->
  <g fill="none" stroke="#14181F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body / Jacket -->
    <path d="M120,380 L120,270 Q120,210 200,210 Q280,210 280,270 L280,380" fill="#0036FF"/>
    <!-- Collar -->
    <path d="M170,210 L200,250 L230,210" fill="#F7F1E6"/>

    <!-- Head / Neck -->
    <rect x="185" y="180" width="30" height="30" fill="#F7F1E6"/>
    <ellipse cx="200" cy="130" rx="55" ry="65" fill="#F7F1E6"/>
    
    <!-- Hair -->
    <path d="M145,120 Q145,55 200,55 Q255,55 255,120 Q240,80 200,80 Q160,80 145,120 Z" fill="#14181F"/>
    
    <!-- Eyes / Smile / Glasses -->
    <circle cx="180" cy="125" r="14" fill="#F7F1E6" stroke="#14181F" stroke-width="6"/>
    <circle cx="220" cy="125" r="14" fill="#F7F1E6" stroke="#14181F" stroke-width="6"/>
    <line x1="194" y1="125" x2="206" y2="125" stroke="#14181F" stroke-width="6"/>
    <!-- Pupils -->
    <circle cx="180" cy="125" r="4" fill="#14181F"/>
    <circle cx="220" cy="125" r="4" fill="#14181F"/>
    <!-- Confident Warm Smile -->
    <path d="M185,155 Q200,170 215,155" fill="none" stroke="#14181F" stroke-width="6"/>

    <!-- Arm holding Smartphone with CivicSense app -->
    <path d="M260,260 L300,280 L280,330" fill="none" stroke="#14181F" stroke-width="12"/>
    <!-- Smartphone -->
    <rect x="270" y="290" width="50" height="85" rx="6" fill="#14181F" stroke="#F7F1E6" stroke-width="4" transform="rotate(-15 270 290)"/>
    <rect x="276" y="300" width="38" height="65" fill="#0036FF" transform="rotate(-15 270 290)"/>
    <!-- Checkmark on phone screen -->
    <path d="M288,335 L294,342 L306,328" stroke="#F7F1E6" stroke-width="5" transform="rotate(-15 270 290)"/>

    <!-- Left Arm giving Thumbs-Up -->
    <path d="M140,260 L90,280 L70,240" fill="none" stroke="#14181F" stroke-width="12"/>
    <circle cx="65" cy="230" r="15" fill="#F7F1E6" stroke="#14181F" stroke-width="6"/>
  </g>
</svg>
