<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campus map — character markers</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#e0e5c4;color:#193e35}
canvas{display:block;width:100vw;height:100dvh}header{position:fixed;top:12px;left:12px;right:12px;max-width:600px;padding:12px 16px;background:#fffffff0;border-radius:16px;box-shadow:0 4px 30px #183b3020}
button,a{font:inherit;color:inherit}button{padding:8px 12px;border:1px solid #bac8b5;border-radius:9px;background:#f6fff5;cursor:pointer}p{margin:7px 0}#message{font-size:13px}
</style>
<canvas id="map" aria-label="Campus map; drag to pan, scroll or pinch to zoom"></canvas>
<header><strong>Campus character markers</strong><p>Example markers only — these are not real participant locations.</p>
<button id="fit">Fit map</button> <button id="gps">Show my GPS</button> <a href="../index.html">Full atlas</a>
<p id="message" role="status">Loading the offline map…</p></header>
<script src="../assets/proj4.js"></script><script src="../gps-projection.js"></script>
<script src="../map-labels.js"></script><script src="atlas-renderer.js"></script>
<script>
'use strict';
const status=document.getElementById('message'),gps=document.getElementById('gps');let map,teams=[],watch=null;
HuntAtlas.create(document.getElementById('map'),hit=>{
 status.textContent=hit.team?hit.team.name:hit.lat.toFixed(6)+', '+hit.lon.toFixed(6);
}).then(m=>{
 map=m;teams=m.source.d.places.slice(0,6).map((p,i)=>({id:'example-'+i,name:'Example '+(i+1),avatar_id:i*11,
 location:{lat:p.lat,lon:p.lon,accuracy:8,sampled_at:Date.now()}}));
 map.setData(teams);status.textContent='Drag or pinch to explore. Tap a character to read its name.';
 document.getElementById('fit').onclick=()=>map.fit();
}).catch(e=>{status.textContent='Could not load map. Serve the kit folder over HTTP: '+e.message;});
gps.onclick=()=>{
 if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null;gps.textContent='Show my GPS';teams=teams.filter(t=>t.id!=='me');map?.setData(teams);return;}
 if(!map)return;
 if(!navigator.geolocation||!window.isSecureContext){status.textContent='GPS needs HTTPS or localhost and location permission.';return;}
 watch=navigator.geolocation.watchPosition(p=>{
  const {latitude:lat,longitude:lon,accuracy}=p.coords;let q;
  try{q=CampusGPS.project(lat,lon,map.meta);}catch{status.textContent='Your position is outside this campus map.';return;}
  if(!CampusGPS.inExtent(q,map.meta)){status.textContent='Your position is outside this campus map.';return;}
  teams=teams.filter(t=>t.id!=='me');teams.push({id:'me',name:'My device',avatar_id:59,location:{lat,lon,accuracy,sampled_at:p.timestamp}});
  map.setData(teams);status.textContent='Device reports accuracy ±'+Math.round(accuracy)+' m.';
 },e=>{status.textContent=e.message;if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;gps.textContent='Show my GPS';},
 {enableHighAccuracy:true,maximumAge:0,timeout:20000});gps.textContent='Stop GPS';
};
setInterval(()=>map?.draw(),5000);
window.addEventListener('pagehide',()=>{if(watch!==null)navigator.geolocation.clearWatch(watch);map?.destroy();});
</script></html>
